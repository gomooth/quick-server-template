[server]
    # HTTP 服务
    [server.http]
    # 服务监听地址和端口
    addr = "0.0.0.0:8000"
    # 服务域名
    host = ""
        # HTTP 静态资源：上传等
        [server.http.resource]
        # 资源域名
        host = "https://res.domain.com"
        # 资源上传目录。该目录为 host 的根目录，相对于项目根目录，或者使用绝对路径
        path = "storage/public"

        # HTTP 缓存
        [server.http.cache]
        enabled = false
        addr    = "127.0.0.1:6379"
        auth    = ""
        db      = 4

    # OpenAPI 服务
    [server.openapi]
    # 服务监听地址和端口
    addr = "0.0.0.0:8001"
    # 服务域名
    host = ""
    # 签名调试开关（仅非生产环境使用，开启后匹配 debug_app_id 的请求将返回签名计算结果，不返回业务数据）
    sign_debug_enabled = false
    # 调试用 AppID，仅在 sign_debug_enabled=true 时生效
    sign_debug_app_id = "sign-debugger"
    # 调试用 AppSecret，仅在 sign_debug_enabled=true 时生效
    sign_debug_secret = "sign-debugger-secret"
        # OpenAPI HTTP 缓存
        [server.openapi.cache]
        enabled = false
        addr    = "127.0.0.1:6379"
        auth    = ""
        db      = 4


[app]
# 服务标识
id = "server-api"
# 服务名
name = "应用名"
# app 环境
env = "local"
# 是否自动删除样例文件
clear_example_file = true
# 启动后是否自动删除配置文件
clear_config_file = false
# 监听配置文件变更，自动更新配置
watch_config_enabled = false
# 密钥：jwt 认证等
secret = "go-quick-server-template"
    # 管理后台配置
    [app.admin]
    # 初始帐号
    account = "admin"
    # 初始密码
    password = "123456"

    [app.log]
    # 日志目录
    dir = "storage/logs"
    # 日志等级
    level = "info"
    # 日志格式：text-文本(默认)，json-JSON(普遍应用于云服务器)
    format = ""
    # 是否输出到控制台
    std_print = false
    # 是否打印 http 日志
    http_log = true
    # 是否仅打印 http 错误日志
    http_log_only_error = true


[data]
    # 持久存储
    [data.persistent]
    enabled = true
    # 是否自动迁移基础表
    auto_migrate = true
        # 默认使用 SQLite，开箱即用，无需外部依赖
        [[data.persistent.connects]]
        name        = "platform"
        type        = "sqlite"
        dsn         = "storage/db/platform.db"
        max_idle    = 10
        max_open    = 100
        log_mode    = false
        max_life_time = 3600

        # MySQL 示例（按需切换）：
        # [[data.persistent.connects]]
        # name        = "platform"
        # type        = "mysql"
        # dsn         = "user:password@tcp(127.0.0.1:3306)/platform?charset=utf8mb4&parseTime=true&loc=Local"
        # max_idle    = 10
        # max_open    = 100
        # log_mode    = false
        # max_life_time = 3600

        # PostgreSQL 示例：
        # [[data.persistent.connects]]
        # name        = "platform"
        # type        = "postgres"
        # dsn         = "host=127.0.0.1 user=user password=password dbname=platform port=5432 sslmode=disable TimeZone=Asia/Shanghai"
        # max_idle    = 10
        # max_open    = 100
        # log_mode    = false
        # max_life_time = 3600

    # 内存数据库 Redis
    [data.redis]
    enabled = false
    addr    = "127.0.0.1:6379"
    auth    = ""
    db      = 0
    idle    = 100
    active  = 10
    wait    = true
    connect_timeout = 3000

    [data.elasticsearch]
    enabled = false
    urls = ["http://127.0.0.1:9200"]
    sniff_enabled = false
    debug_enabled = true
        [data.elasticsearch.index]
        key = ""

    # 缓存
    [data.cache]
    enabled = false
    engine = "redis"
        [data.cache.redis]
        addr    = "127.0.0.1:6379"
        auth    = ""
        db      = 4

    # 分布式锁
    [data.locker]
    enabled = false
    engine = "redis"
        [data.locker.redis]
        addr    = "127.0.0.1:6379"
        auth    = ""
        db      = 3


# 消息消费者
[consumer]
    [consumer.kafka]
    addrs   = ["127.0.0.1:9092"]

    [consumer.redis]
    addr    = "127.0.0.1:6379"
    auth    = ""
    db      = 3

    [consumer.httpsqs]
    addr    = "127.0.0.1:1218"
    auth    = ""
    timeout = 10


# 消息生产者
[producer]
    [producer.kafka]
    addrs   = ["127.0.0.1:9092"]

    [producer.redis]
    addr    = "127.0.0.1:6379"
    auth    = ""
    db      = 3

    [producer.httpsqs]
    addr    = "127.0.0.1:1218"
    auth    = ""
    timeout = 10
